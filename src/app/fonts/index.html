<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audit the Human | Alpha</title>
    <style>
        body { background: #050505; color: #00ffad; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { border: 2px solid #00ffad; padding: 40px; border-radius: 10px; text-align: center; box-shadow: 0 0 30px rgba(0,255,173,0.2); }
        input { background: #111; border: 1px solid #00ffad; color: #00ffad; padding: 10px; width: 300px; margin-bottom: 20px; }
        button { background: #00ffad; color: #000; border: none; padding: 15px 30px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        #result { margin-top: 20px; font-size: 1.5rem; display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h1>AUDIT THE HUMAN</h1>
        <p>OPENGRADIENT FORENSIC ALPHA</p>
        <input type="text" id="url" placeholder="REPOSITORY_URL">
        <br>
        <button onclick="runAudit()">Execute Audit</button>
        <div id="result">
            <div id="score">SCORE: 96%</div>
            <div style="font-size: 0.8rem;">STATUS: TEE_VERIFIED</div>
        </div>
    </div>

    <script>
        function runAudit() {
            const btn = document.querySelector('button');
            btn.innerText = 'EXECUTING...';
            setTimeout(() => {
                document.getElementById('result').style.display = 'block';
                btn.innerText = 'AUDIT COMPLETE';
            }, 1500);
        }
    </script>
</body>
</html>
